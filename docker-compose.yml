services:
  db:
    build: ./deploy/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edmepets}
      POSTGRES_USER: ${POSTGRES_USER:-edmepets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edmepets}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./back
    restart: unless-stopped
    env_file:
      - ./back/.env.production
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./front
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
